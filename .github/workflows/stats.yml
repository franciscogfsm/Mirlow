# Every few hours, collects downloads, stars and feedback into stats.json on
# the stats-data branch, which the website's /stats page reads. The branch holds
# a single commit that is replaced each time, so it never grows.
name: Collect stats

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: read
  issues: read

concurrency:
  group: stats

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin stats-data --depth=1 && git show origin/stats-data:stats.json > previous.json || true
          mkdir -p out
          node scripts/stats/collect.mjs previous.json out/stats.json
          # Vercel builds every branch it sees; this one is data, not a site.
          echo '{ "git": { "deploymentEnabled": false } }' > out/vercel.json
      - name: Publish
        working-directory: out
        run: |
          git init -q -b stats-data
          git add stats.json vercel.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Stats"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" stats-data

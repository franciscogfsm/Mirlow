<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="170" y1="90" x2="860" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="0.55" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glowA" cx="250" cy="230" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="800" cy="840" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="250" y1="330" x2="780" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>
    <linearGradient id="rim" x1="200" y1="80" x2="820" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="80" x2="512" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shape">
      <rect x="80" y="80" width="864" height="864" rx="212"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <g clip-path="url(#shape)">
    <rect x="80" y="80" width="864" height="864" fill="url(#body)"/>
    <rect x="80" y="80" width="864" height="864" fill="url(#glowA)"/>
    <rect x="80" y="80" width="864" height="864" fill="url(#glowB)"/>
    <path d="M80 80h864v300C760 470 300 470 80 380z" fill="url(#sheen)"/>

    <!-- The mark's glow, then the mark: an "m" drawn as a wave and its reflection. -->
    <path d="M292 672V470a110 110 0 0 1 220 0v140M512 470a110 110 0 0 1 220 0v202"
          fill="none" stroke="url(#stroke)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"
          opacity="0.28" filter="url(#soft)"/>
    <path d="M292 672V470a110 110 0 0 1 220 0v140M512 470a110 110 0 0 1 220 0v202"
          fill="none" stroke="url(#stroke)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="83" y="83" width="858" height="858" rx="209" fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>

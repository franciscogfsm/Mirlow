[package]
name = "mirlow"
version = "1.7.0"
description = "Mirror your iPhone to Windows. For free."
authors = ["Mirlow contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

# A plain Rust library. Tauri's template also asks for "cdylib" and
# "staticlib", which only mobile targets need; with the GNU toolchain a debug
# "cdylib" of this size exceeds the 65,535 exports a Windows DLL can have.
[lib]
name = "mirlow_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.2"
windows = { version = "0.61", features = [
  "ApplicationModel_Core",
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Radios",
  "Foundation",
  "Foundation_Numerics",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Media_Core",
  "Media_Miracast",
  "Media_Playback",
  "Win32_Media",
  "Win32_UI_Input",
  "Security_Cryptography",
  "Storage_Streams",
  "System",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_System_WinRT_Direct3D11",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
